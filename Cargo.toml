[package]
name = "rdsh"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
axum = { version = "0.8.9", default-features = false, features = ["http1", "ws", "tokio", "query"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
getrandom = "0.3"
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util", "io-std", "net", "signal"] }
tokio-util = "0.7.20"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.29"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
