[package]
name = "rdsh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
globset = "0.4.21"
ignore = "0.4.34"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util", "signal"] }
tokio-util = "0.7.20"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.27.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
